# Disposable Postgres for DB-touching tests:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://test:test@localhost:55432/test pytest tests/test_db.py
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
